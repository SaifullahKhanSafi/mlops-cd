name: Github CD Workflow
on:
    push:
        tags:
            - "v*.*.*"

permissions:
    contents: read
    packages: write

jobs:
    tests:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4


            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.12"

            - name: Install Dependencies
              run: pip install -r requirements.txt

            - name: Unit Tests
              run: python -m pytest

    build:
        needs: tests
        runs-on: ubuntu-latest

        outputs:
            version: ${{steps.version.outputs.version}}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Get Version
              id: version
              run: |
                VERSION=${GITHUB_REF_NAME#v}
                echo "version=$VERSION" >> "$GITHUB_OUTPUT"

            - name: Login GHCR
              uses: docker/login-action@v3
              with: 
                registry: ghcr.io
                username: ${{github.actor}}
                password: ${{secrets.GITHUB_TOKEN}}

            - name: Build, Tag, and Push Docker Image
              run: |
                # 1. Force the repository name to lowercase
                REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
                IMAGE_ID=ghcr.io/$REPO
                
                # 2. Grab the clean version number (e.g., 1.0.0)
                VERSION=${{ steps.version.outputs.version }}
                
                # 3. Build and tag using the lowercase IMAGE_ID
                docker build -t $IMAGE_ID:$VERSION -t $IMAGE_ID:latest .
                
                # 4. Push both tags to GHCR
                docker push $IMAGE_ID:$VERSION
                docker push $IMAGE_ID:latest

     
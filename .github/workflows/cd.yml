name: Github CD Workflow
on:
    push:
        tags:
            - "v*.*.*"

permissions:
    contents: read
    packages: write

jobs:
    tests:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.12"

            - name: Install Dependencies
              run: pip install -r requirements.txt

            - name: Unit Tests
              run: pytest
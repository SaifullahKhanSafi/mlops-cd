name: Github CD Workflow
on:
    push:
        tags:
            - "v*.*.*"

permissions:
    contents: read
    packages: write

jobs:
    tests:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4


            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.12"

            - name: Install Dependencies
              run: pip install -r requirements.txt

            - name: Unit Tests
              run: python -m pytest

    build:
        needs: tests
        runs-on: ubuntu-latest

        outputs:
            version: ${{steps.version.outputs.version}}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Get Version
              id: version
              run: |
                VERSION = VERSION=${GITHUB_REF_NAME#v}
                echo "version=$VERSION" >> "$GITHUB_OUTPUT"

            - name: Login GHCR
              uses: docker/login-action@v3
              with: 
                registry: ghcr.io
                username: ${{github.actor}}
                password: ${{secrets.GITHUB_TOKEN}}

            - name: Build
              run: |
                 docker build -t ghcr.io/${{github.repository}}:${{steps.version.outputs.version}} -t ghcr.io/${{github.repository}}:latest

            - name: Push
              run: |
                docker push ghcr.io/${{github.repository}}:${{steps.version.outputs.version}}
                docker push ghcr.io/${{github.repository}}:latest

     